apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rain.fullname" . }}
  labels:
    {{- include "rain.labels" . | nindent 4 }}
type: Opaque
data:
  database-url: {{ include "rain.databaseUrl" . | b64enc }}
  app-secret-key: {{ required "appSecretKey is required -- generate one with `openssl rand -base64 48`, same as bootstrap.py does for the Compose deployment" .Values.appSecretKey | b64enc }}
  {{- if .Values.database.embedded.enabled }}
  postgres-password: {{ required "database.embedded.password is required when database.embedded.enabled is true" .Values.database.embedded.password | b64enc }}
  {{- end }}
  {{- if and .Values.storage.s3.enabled .Values.storage.s3.accessKeyId }}
  s3-access-key-id: {{ .Values.storage.s3.accessKeyId | b64enc }}
  s3-secret-access-key: {{ .Values.storage.s3.secretAccessKey | b64enc }}
  {{- end }}
