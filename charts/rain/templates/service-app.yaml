apiVersion: v1
kind: Service
metadata:
  name: {{ include "rain.fullname" . }}-app
  labels:
    {{- include "rain.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  # ClusterIP when an Ingress fronts this (the normal case); otherwise
  # whatever service.type says -- LoadBalancer/NodePort for a cluster
  # reached directly on app.port, mirroring WEB_FRONTEND=false skipping
  # Caddy in the Compose deployment.
  type: {{ if .Values.ingress.enabled }}ClusterIP{{ else }}{{ .Values.service.type }}{{ end }}
  selector:
    {{- include "rain.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: {{ .Values.app.port }}
      targetPort: http
