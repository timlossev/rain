{{- if not .Values.worker.embedded }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rain.fullname" . }}-worker
  labels:
    {{- include "rain.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "rain.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "rain.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "rain.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["rain-worker"]
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: syslog-tcp
              containerPort: {{ .Values.syslog.port }}
              protocol: TCP
            - name: syslog-udp
              containerPort: {{ .Values.syslog.port }}
              protocol: UDP
          env:
            {{- include "rain.commonEnv" . | nindent 12 }}
          # Same "is the syslog TCP listener accepting connections"
          # check backend/Dockerfile's inherited HTTP healthcheck gets
          # overridden to in docker-compose.yml, since this workload
          # doesn't serve HTTP at all.
          livenessProbe:
            tcpSocket:
              port: syslog-tcp
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: syslog-tcp
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- if and .Values.storage.persistence.enabled (not .Values.storage.s3.enabled) }}
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
          {{- end }}
          {{- with .Values.worker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if and .Values.storage.persistence.enabled (not .Values.storage.s3.enabled) }}
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: {{ include "rain.fullname" . }}-uploads
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
