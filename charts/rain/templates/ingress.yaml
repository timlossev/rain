{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rain.fullname" . }}
  labels:
    {{- include "rain.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | default .Values.domain }}
      secretName: {{ .Values.ingress.tls.secretName | default (printf "%s-tls" (include "rain.fullname" .)) }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | default .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "rain.fullname" . }}-app
                port:
                  number: {{ .Values.app.port }}
{{- end }}
