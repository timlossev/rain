name: rain

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      RAIN_DOMAIN: ${RAIN_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_started
    networks: [rain]

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["rain-web"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rain}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rain}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
    volumes:
      - rain_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    networks: [rain]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["rain-worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rain}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rain}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      SYSLOG_PORT: ${SYSLOG_PORT:-5514}
    # Published directly (not through Caddy -- this is raw syslog, not
    # HTTP): point your syslog-ng destination at this host on this port.
    # See docs/architecture.md for the syslog-ng destination snippet.
    ports:
      - "${SYSLOG_PORT:-5514}:${SYSLOG_PORT:-5514}/tcp"
      - "${SYSLOG_PORT:-5514}:${SYSLOG_PORT:-5514}/udp"
    volumes:
      - rain_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    networks: [rain]

  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rain}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rain} -d ${POSTGRES_DB:-rain}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [rain]

networks:
  rain:

volumes:
  pgdata:
  rain_uploads:
  caddy_data:
  caddy_config:
