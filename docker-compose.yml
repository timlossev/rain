name: rain

services:
  caddy:
    image: caddy:2-alpine
    # Off when WEB_FRONTEND=false in .env (e.g. an AWS ALB already
    # terminates TLS in front of RAIN) -- also drop "web-frontend" from
    # COMPOSE_PROFILES there when you do. See .env.example.
    profiles: ["web-frontend"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      RAIN_DOMAIN: ${RAIN_DOMAIN:-localhost}
      APP_PORT: ${APP_PORT:-8000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_started
    networks: [rain]

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["rain-web"]
    environment:
      # POSTGRES_URL, if set, points at an external/managed Postgres
      # instead of the "db" service below (which then shouldn't be
      # running at all -- see its profiles: below and .env.example).
      DATABASE_URL: ${POSTGRES_URL:-postgresql+asyncpg://${POSTGRES_USER:-rain}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rain}}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      APP_PORT: ${APP_PORT:-8000}
      # Never true against a real deployment -- puts full tracebacks
      # (source paths, local variables, SQL text) in 500 responses.
      DEBUG: ${DEBUG:-false}
      # Document repository storage -- local disk (the rain_uploads
      # volume below) unless S3_BUCKET is set. See .env.example and
      # rain.modules.documents.storage.
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      # Folds the worker's syslog listener + rule engine + notifications +
      # calendar sweep + LDAP sync into this same container -- see
      # .env.example's "Minimal mode" section and docker-compose.minimal.yml,
      # which adds the syslog port mapping this container doesn't declare
      # by default (it would conflict with the separate worker service's
      # own mapping of the same host port in the normal two-container
      # topology this is off in).
      EMBED_WORKER: ${EMBED_WORKER:-false}
      # See .env.example -- off for a Postgres that can't grant/doesn't
      # ship the vector extension (a managed-database role without
      # CREATE EXTENSION privilege, or standard RDS in AWS GovCloud).
      ENABLE_PGVECTOR: ${ENABLE_PGVECTOR:-true}
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    volumes:
      - rain_uploads:/data/uploads
    # No depends_on: db here on purpose -- an explicit dependency would
    # force Compose to start "db" even when POSTGRES_URL points elsewhere
    # and "local-db" has been dropped from COMPOSE_PROFILES (Compose
    # starts anything an active service depends_on regardless of that
    # service's own profile). rain.db.migrate.wait_for_database() covers
    # the "Postgres isn't ready yet" window this used to guard instead,
    # for both the local container and an external instance alike.
    networks: [rain]

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["rain-worker"]
    # Off when EMBED_WORKER=true in .env (its own duties folded into the
    # app container instead -- "minimal mode", see .env.example) -- also
    # drop "worker" from COMPOSE_PROFILES there when you do.
    profiles: ["worker"]
    environment:
      DATABASE_URL: ${POSTGRES_URL:-postgresql+asyncpg://${POSTGRES_USER:-rain}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rain}}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      SYSLOG_PORT: ${SYSLOG_PORT:-5514}
      # Both containers run control-schema migrations independently at
      # startup (see rain.db.migrate's module docstring) and both import
      # rain.db.tenant_models -- this needs to match the app container's
      # own value so the two never disagree on whether the embedding
      # columns/extension exist.
      ENABLE_PGVECTOR: ${ENABLE_PGVECTOR:-true}
      # See app's own comment above -- the calendar sweep's "refresh
      # document from webhook" policy runs here and needs the same
      # storage backend the app's document routes use.
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    # Published directly (not through Caddy -- this is raw syslog, not
    # HTTP): point your syslog-ng destination at this host on this port.
    # See docs/architecture.md for the syslog-ng destination snippet.
    ports:
      - "${SYSLOG_PORT:-5514}:${SYSLOG_PORT:-5514}/tcp"
      - "${SYSLOG_PORT:-5514}:${SYSLOG_PORT:-5514}/udp"
    volumes:
      - rain_uploads:/data/uploads
    # Overrides the image's inherited HEALTHCHECK (backend/Dockerfile checks
    # :8000/healthz -- the web app's endpoint, which this container doesn't
    # serve; worker runs the syslog listener instead). Checks the syslog
    # TCP listener is actually accepting connections.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', ${SYSLOG_PORT:-5514}), timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 6
    # See app's comment above -- same reasoning, no depends_on: db here.
    networks: [rain]

  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    # Off when POSTGRES_URL is set in .env (pointing at an external/
    # managed Postgres instead) -- also drop "local-db" from
    # COMPOSE_PROFILES there when you do. See .env.example.
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rain}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rain} -d ${POSTGRES_DB:-rain}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [rain]

networks:
  rain:

volumes:
  pgdata:
  rain_uploads:
  caddy_data:
  caddy_config:
