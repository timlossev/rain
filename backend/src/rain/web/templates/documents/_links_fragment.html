{# expects: links (list of DocumentLink with .document loaded), linked_type, linked_id #}
<div class="card">
  <div class="card-title">Linked Documents</div>
  <table>
    <thead><tr><th>Number</th><th>Title</th><th></th></tr></thead>
    <tbody>
      {% for link in links %}
      <tr>
        <td><a href="/documents/{{ link.document.id }}">{{ link.document.doc_number }}</a></td>
        <td>{{ link.document.title }}</td>
        <td class="actions">
          <a class="btn btn-sm" href="/documents/{{ link.document.id }}/download">Download</a>
          <form class="inline" method="post" action="/documents/{{ link.document_id }}/unlink/{{ link.id }}" data-confirm="Unlink this document?">
            <button class="btn btn-sm btn-danger" type="submit">Unlink</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="3" class="muted">No documents linked yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
  <a class="btn btn-sm" href="/documents/new?linked_type={{ linked_type }}&linked_id={{ linked_id }}">+ Attach document</a>
</div>
