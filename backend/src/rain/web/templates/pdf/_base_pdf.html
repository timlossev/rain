<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* xhtml2pdf only understands a CSS 2.1-ish subset (no flexbox/grid, no
     text-transform, no border-radius) -- kept deliberately plain. */
  @page { size: A4; margin: 2cm 1.6cm; }
  body { font-family: Helvetica, Arial, sans-serif; font-size: 10pt; color: #1a1d29; }
  .pdf-header { width: 100%; border-bottom: 2px solid {{ branding.accent_color or "#6366f1" }}; padding-bottom: 10px; margin-bottom: 18px; }
  .pdf-header table { width: 100%; }
  .pdf-instance { font-size: 8.5pt; color: #6b7280; }
  .pdf-doc-type { font-size: 8.5pt; color: #6b7280; text-align: right; }
  .pdf-title { font-size: 18pt; font-weight: bold; margin: 4px 0 2px; }
  .pdf-subtitle { font-size: 10pt; color: #6b7280; margin-bottom: 2px; }
  .pdf-badge { padding: 2px 7px; border: 1px solid #c7cad3; color: #444; font-size: 8pt; }
  table.pdf-kv { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
  table.pdf-kv th { text-align: left; width: 30%; padding: 5px 8px; background-color: #f4f5f7; border: 1px solid #e3e5ea; font-size: 8.5pt; color: #6b7280; }
  table.pdf-kv td { padding: 5px 8px; border: 1px solid #e3e5ea; }
  h2.pdf-section { font-size: 12pt; margin: 18px 0 6px; padding-bottom: 3px; border-bottom: 1px solid #e3e5ea; }
  .pdf-comment { padding: 6px 0; border-bottom: 1px solid #e3e5ea; }
  .pdf-comment-meta { color: #6b7280; font-size: 8.5pt; }
  .pdf-muted { color: #6b7280; }
  .pdf-footer { font-size: 7.5pt; color: #9aa0ac; margin-top: 24px; padding-top: 6px; border-top: 1px solid #e3e5ea; }
  table.pdf-list { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
  table.pdf-list th { text-align: left; padding: 5px 8px; background-color: #f4f5f7; border: 1px solid #e3e5ea; font-size: 8.5pt; color: #6b7280; }
  table.pdf-list td { padding: 5px 8px; border: 1px solid #e3e5ea; font-size: 9pt; }
  .pdf-doc-body { font-size: 9.5pt; }
  .pdf-doc-body h1, .pdf-doc-body h2, .pdf-doc-body h3 { margin: 12px 0 4px; }
  .pdf-doc-body h1 { font-size: 14pt; }
  .pdf-doc-body h2 { font-size: 12pt; }
  .pdf-doc-body h3 { font-size: 10.5pt; }
  .pdf-doc-body p { margin: 0 0 8px; }
  .pdf-doc-body ul, .pdf-doc-body ol { margin: 0 0 8px; padding-left: 18px; }
  .pdf-doc-body code { font-family: Consolas, "Courier New", monospace; background-color: #f4f5f7; }
  .pdf-doc-body pre { font-family: Consolas, "Courier New", monospace; background-color: #f4f5f7; padding: 8px; white-space: pre-wrap; }
  .pdf-doc-body blockquote { margin: 0 0 8px; padding-left: 10px; border-left: 2px solid #c7cad3; color: #6b7280; }
  .pdf-doc-body table { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
  .pdf-doc-body table th, .pdf-doc-body table td { border: 1px solid #e3e5ea; padding: 4px 6px; }
  pre.pdf-doc-body { font-family: Consolas, "Courier New", monospace; white-space: pre-wrap; background-color: #f4f5f7; padding: 8px; }
</style>
</head>
<body>
  <div class="pdf-header">
    <table>
      <tr>
        {% if pdf_logo_src %}<td style="width:{{ pdf_logo_width + 8 }}px;"><img style="width:{{ pdf_logo_width }}px;height:{{ pdf_logo_height }}px;" src="{{ pdf_logo_src }}"></td>{% endif %}
        <td><div class="pdf-instance">{{ branding.instance_name or "RAIN" }}</div></td>
        <td class="pdf-doc-type">{{ doc_kind }}<br>Generated {{ generated_at }}</td>
      </tr>
    </table>
  </div>

  {% block pdf_content %}{% endblock %}

  <div class="pdf-footer">Generated by {{ branding.instance_name or "RAIN" }} on {{ generated_at }}. For internal use.</div>
</body>
</html>
