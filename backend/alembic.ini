; Two independent migration chains driven from one file, selected via
; Config(ini_section=...) -- see rain.db.migrate. sqlalchemy.url below is a
; placeholder; rain.db.migrate always overrides it from Settings before
; running anything, so the real DATABASE_URL is never duplicated here.

[control]
script_location = %(here)s/migrations/control
sqlalchemy.url = postgresql+asyncpg://rain:rain@localhost:5432/rain
file_template = %%(rev)s_%%(slug)s

[tenant]
script_location = %(here)s/migrations/tenant
sqlalchemy.url = postgresql+asyncpg://rain:rain@localhost:5432/rain
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
