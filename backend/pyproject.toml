[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rain"
version = "0.1.0"
description = "RAIN system of record -- foundation + asset registry"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn>=0.32,<0.33",
    "wsproto>=1.2,<2",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.30,<0.31",
    "alembic>=1.13,<2",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.12,<0.1",
    "argon2-cffi>=23.1,<24",
    "cryptography>=43,<44",
    "aiosmtplib>=3.0,<4",
    "httpx>=0.27,<0.28",
    "xhtml2pdf>=0.2.16,<0.3",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "aiosqlite>=0.20,<0.21",
]

[project.scripts]
rain-web = "rain.cli:run_web"
rain-worker = "rain.cli:run_worker"

[tool.hatch.build.targets.wheel]
packages = ["src/rain"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
