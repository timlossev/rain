[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rain"
version = "0.1.0"
description = "RAIN system of record -- foundation + asset registry"
requires-python = ">=3.12"
dependencies = [
    # Versions audited 2026-08-15 against a container vulnerability scan
    # that flagged the app/worker images (starlette, cryptography, and
    # others -- several of these floated on ranges whose upper bound
    # pre-dated the actual fix release, e.g. cryptography<44 excluded the
    # 49.0.0 fix outright regardless of a fresh `docker build`). Bumped
    # every ceiling to the ~latest available minor/patch line as of that
    # date; see the security-fix commit for the specific CVEs this closed.
    # cryptography re-bumped 49->50 the same week for CVE-2026-69247
    # (Bleichenbacher oracle in PKCS#7 EnvelopedData decryption) -- our
    # own <50 ceiling was the same "excludes the actual fix" mistake
    # again, caught by a second scan pass rather than by looking harder
    # the first time.
    #
    # 2026-08-30: the Aug 2026 OpenSSL advisory batch (CVE-2026-54874,
    # 63072, 63075, 63076, 18798, 14457) doesn't need a ceiling change
    # here -- cryptography's wheels vendor their own OpenSSL build rather
    # than linking the image's system copy, and this range has no upper
    # pin below whatever pyca's next release contains, so a build after
    # that release ships the patched vendored copy automatically (no
    # lockfile in this project pins an exact resolved version). The
    # image's *system* OpenSSL -- what `ssl`/ldap3/asyncpg's TLS actually
    # link against -- is handled separately, in the Dockerfile's `apk
    # upgrade` step.
    "fastapi>=0.141,<0.142",
    "uvicorn>=0.52,<0.53",
    "wsproto>=1.3,<2",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.31,<0.32",
    "alembic>=1.19,<2",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.12,<0.1",
    "argon2-cffi>=25.1,<26",
    "cryptography>=50,<51",
    "aiosmtplib>=5.1,<6",
    "httpx>=0.28,<0.29",
    "xhtml2pdf>=0.2.17,<0.3",
    "openpyxl>=3.1,<4",
    "markdown>=3.10,<4",
    # Sanitizes markdown.markdown()'s HTML output (rain.modules.documents.
    # textbody.render_markdown) -- Python-Markdown passes raw HTML in the
    # source straight through by design, so an unsanitized render is a
    # stored-XSS sink wherever that HTML is later injected via innerHTML/
    # |safe (the inline preview endpoints, the PDF export). Pure Python,
    # same "nothing to compile" reasoning as this file's other deps.
    "bleach>=6.2,<7",
    "ldap3>=2.9,<3",
    "python3-saml>=1.16,<2",
    "pgvector>=0.5,<0.6",
    # Online/streaming ML for Correlation Rules' "ML anomalies" rule type
    # (rain.modules.tickets.correlation) -- pure incremental learning (one
    # event at a time, no batch retraining), which is what a live syslog
    # stream needs; a river.anomaly.HalfSpaceTrees model's state is
    # pickled into CorrelationRuleState.ml_model between events.
    "river>=0.21,<0.22",
    # S3-compatible document storage (rain.modules.documents.storage) --
    # only ever exercised when Settings.s3_bucket is set; the synchronous
    # client matches the existing (already synchronous) StorageBackend
    # Protocol, same trade-off local disk I/O already makes in the same
    # call sites rather than restructuring every caller onto an async
    # storage interface for this alone.
    "boto3>=1.40,<2",
    # JSONPath evaluation for Service Catalog fields sourced from a
    # document (rain.modules.catalog.service.resolve_field_source) -- pure
    # Python, no compiled extension, so it's fine on the alpine base image
    # without a musllinux wheel concern (same reasoning as argon2-cffi's
    # own comment, just the opposite conclusion: nothing to compile here).
    "jsonpath-ng>=1.6,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "aiosqlite>=0.20,<0.21",
]

[project.scripts]
rain-web = "rain.cli:run_web"
rain-worker = "rain.cli:run_worker"

[tool.hatch.build.targets.wheel]
packages = ["src/rain"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# rain.db.base.get_engine() caches one AsyncEngine (and its asyncpg
# connection pool) at module-global scope, and test_integration.py's own
# _clean_slate fixture is module-scoped too (one drop-and-recreate per
# module, not per test) -- both assume every test in that module shares
# one event loop. This ini option alone doesn't reach that far (it's
# fixture-loop-scope only in this pytest-asyncio version; a plain async
# def test_* still defaults to its own function-scoped loop regardless),
# so test_integration.py also sets an explicit
# pytest.mark.asyncio(loop_scope="module") -- see that module's own
# comment for how this was confirmed live, the first time this suite ever
# ran against a real Postgres (no Postgres was available at all before).
asyncio_default_fixture_loop_scope = "module"
testpaths = ["tests"]
